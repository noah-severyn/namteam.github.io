2026960b-6a231ea4-2a504ba0: |-
    Traffic Planners Have Lost The Plot

2026960b-6a231ea4-2a504ba1: |-
    <p>
    Mayor! It seems our traffic engineers have been taking a wrong turn with the data they received, resulting in some peculiar roadways and puzzling intersections that resemble modern art rather than functional pathways—proof that when you feed the wrong info, even the best engineers can get off track:
    </p><p>
    They could not find the correct <u>NAM DLL</u> file in your Plugins.
    </p><p>
    Required NAM DLL version: <u>#nam_dll_version_expected#</u>
    <br>
    Installed NAM DLL version: <u>#nam_dll_version or 'not installed'#</u>
    </p>